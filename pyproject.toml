[project]
name = "py-siglent-spd3000"
version = "0.1.0"
description = "Python driver and centralized gateway for Siglent SPD3000-series power supplies"
readme = "README.md"
authors = [
    { name = "Sinclair Lab", email = "sinclairquantumlab@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "pyvisa>=1.16",
    "pyvisa-py[usb]>=0.8",
    "python-vxi11>=0.9",
    "standard-xdrlib; python_version >= '3.13'",
    "tomli>=2.2; python_version < '3.11'",
    "zeroconf>=0.151.3",
]

[project.scripts]
spd3000 = "siglent_spd3000.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siglent_spd3000"]

[tool.hatch.build.targets.sdist]
exclude = ["/.agents", "/docs/*.pdf"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = [".agents/tests"]
markers = ["hardware: requires a physical Siglent SPD3000-series supply"]

[tool.coverage.run]
branch = true
source = ["siglent_spd3000"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["siglent_spd3000"]

[tool.ruff]
extend-exclude = ["AGENTS.md"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
