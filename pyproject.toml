[project]
name = "py-siglent-spd3000"
version = "0.1.0"
description = "Python driver and optional gateway for Siglent SPD3000-series power supplies"
readme = "README.md"
authors = [
    { name = "Sinclair Lab", email = "sinclairquantumlab@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siglent_spd3000"]
